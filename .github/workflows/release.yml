name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v, for example 1.0.57 or 1.0.56.5"
        required: true
        type: string
      draft:
        description: "Create GitHub Release as draft"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  windows-release:
    name: Build and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Resolve release version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}".TrimStart('v')
          }

          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?(-[0-9A-Za-z.-]+)?$') {
            throw "Version must look like 1.0.57, 1.0.56.5, or 1.0.57-beta. Got: $version"
          }

          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build, pack, and publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseParameters = @{
            Version = $env:RELEASE_VERSION
            SelfContained = $true
            PublishGitHub = $true
            GitHubRepo = "${{ github.repository }}"
          }

          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.draft }}" -eq "true") {
            $releaseParameters.Draft = $true
          }

          ./release.ps1 @releaseParameters

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SerpiumVPN-${{ env.RELEASE_VERSION }}-release
          path: publish/releases/*
          if-no-files-found: error
